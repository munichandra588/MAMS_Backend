# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/military_asset_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}

# JWT
jwt.secret=ThisIsASecretKeyForJWTTokenGenerationMilitaryAssetManagement2024SecureKey
jwt.expiration=86400000

# CORS
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app,https://*.onrender.com,http://localhost:3000}
